syntax = "proto3";

package crosslab.protocol.v1;

message CapabilityVersionV1 {
  uint32 major = 1;
  uint32 minor = 2;
}

message CapabilityAdvertisementEntryV1 {
  string capability_id = 1;
  CapabilityVersionV1 min_version = 2;
  CapabilityVersionV1 max_version = 3;
  bool runtime_available = 4;
}

message CapabilityAdvertisementV1 {
  repeated CapabilityAdvertisementEntryV1 entries = 1;
}

enum RetryClassV1 {
  RETRY_CLASS_NON_RETRYABLE = 0;
  RETRY_CLASS_IDEMPOTENT = 1;
}

message ControlRequestV1 {
  bytes request_id = 1;
  string capability_id = 2;
  CapabilityVersionV1 capability_version = 3;
  string operation_name = 4;
  RetryClassV1 retry_class = 5;
  bytes body = 6;
}

message ProtocolErrorV1 {
  uint32 code = 1;
  optional string diagnostic = 2;
}

message ControlResponseV1 {
  bytes request_id = 1;
  oneof result {
    bytes success_body = 2;
    ProtocolErrorV1 error = 3;
  }
}

message CancelRequestV1 {
  bytes request_id = 1;
}

enum StreamDirectionV1 {
  STREAM_DIRECTION_UNSPECIFIED = 0;
  STREAM_DIRECTION_SOURCE_TO_DESTINATION = 1;
  STREAM_DIRECTION_DESTINATION_TO_SOURCE = 2;
}

message DataStreamOpenV1 {
  bytes session_id = 1;
  bytes stream_id = 2;
  bytes operation_id = 3;
  string capability_id = 4;
  CapabilityVersionV1 capability_version = 5;
  string operation_name = 6;
  StreamDirectionV1 direction = 7;
  uint32 stream_index = 8;
}
