[package]
name = "crosslab-mobile-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[features]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]
development-provisioning = [
    "dep:crosslab-transport-quic",
    "dep:tokio",
    "crosslab-transport-quic/development-provisioning",
]

[dependencies]
crosslab-core = { path = "../core" }
crosslab-identity = { path = "../identity" }
crosslab-policy = { path = "../policy" }
crosslab-protocol = { path = "../protocol" }
crosslab-runtime = { path = "../runtime" }
crosslab-transport-quic = { path = "../../transports/quic", optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync", "time"] }
uniffi.workspace = true

[[bin]]
name = "crosslab-uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[dev-dependencies]
crosslab-crypto = { path = "../crypto" }
rcgen.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
