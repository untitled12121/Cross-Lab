[workspace]
members = [
    "apps/sim",
    "crates/core",
    "crates/crypto",
    "crates/identity",
    "crates/policy",
    "crates/protocol",
    "experiments/m9-networking",
    "transports/quic",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/untitled12121/Cross-Lab"

[workspace.dependencies]
blake3 = "=1.8.7"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "=0.4.3"
hmac = "=0.13.0"
prost = "=0.14.4"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
