[workspace]
members = [
    "apps/desktop",
    "apps/sim",
    "crates/agent",
    "crates/core",
    "crates/crypto",
    "crates/identity",
    "crates/identity-store",
    "crates/mobile-ffi",
    "crates/policy",
    "crates/policy-store",
    "crates/protocol",
    "crates/runtime",
    "experiments/m9-networking",
    "transports/quic",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/untitled12121/Cross-Lab"

[workspace.dependencies]
blake3 = "=1.8.7"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
futures-util = "=0.3.34"
getrandom = "=0.4.3"
gpui-kit = "=0.6.1"
hmac = "=0.13.0"
oo7 = { version = "=0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
prost = "=0.14.4"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
qrcode-rs = { version = "=2.1.1", default-features = false, features = ["std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", default-features = false }
uniffi = { version = "=0.32.1", default-features = false }
zbus = "=5.19.0"
zeroize = { version = "=1.9.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
