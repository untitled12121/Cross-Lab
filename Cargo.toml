[workspace]
members = [
    "apps/sim",
    "crates/core",
    "crates/crypto",
    "crates/identity",
    "crates/policy",
    "crates/protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/untitled12121/Cross-Lab"

[workspace.lints.rust]
unsafe_code = "forbid"
