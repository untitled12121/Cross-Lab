[workspace]
members = [
    "apps/sim",
    "crates/core",
    "crates/crypto",
    "crates/identity",
    "crates/policy",
    "crates/protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/untitled12121/Cross-Lab"

[workspace.dependencies]
blake3 = "=1.8.7"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "=0.4.3"
zeroize = { version = "=1.9.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
