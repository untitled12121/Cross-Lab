name: Task 8 Plan Reconcile

on:
  push:
    branches:
      - m9-authority-replay-remediation
    paths:
      - .github/workflows/task8-plan-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Reconcile evidence-backed checkboxes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/superpowers/plans/2026-09-14-foundation-authority-replay-remediation.md")
          text = path.read_text()

          for task in range(1, 8):
              start_marker = f"### Task {task}:"
              end_marker = f"### Task {task + 1}:"
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              section = section.replace("- [ ] **Step", "- [x] **Step")
              text = text[:start] + section + text[end:]

          start = text.index("### Task 8:")
          section = text[start:]
          for step in (1, 2, 3, 4, 6):
              old = f"- [ ] **Step {step}:"
              new = f"- [x] **Step {step}:"
              if old not in section:
                  raise SystemExit(f"missing Task 8 Step {step} checkbox")
              section = section.replace(old, new, 1)
          text = text[:start] + section

          for task in range(1, 8):
              start_marker = f"### Task {task}:"
              end_marker = f"### Task {task + 1}:"
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              if "- [ ] **Step" in text[start:end]:
                  raise SystemExit(f"unchecked evidence-backed step remains in Task {task}")

          task8 = text[text.index("### Task 8:"):]
          for step in (5, 7):
              if f"- [ ] **Step {step}:" not in task8:
                  raise SystemExit(f"Task 8 Step {step} must remain unchecked")

          path.write_text(text)
          PY
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/task8-plan-reconcile.yml
          git add docs/superpowers/plans/2026-09-14-foundation-authority-replay-remediation.md .github/workflows/task8-plan-reconcile.yml
          git commit -m "docs: reconcile final M9 foundation hardening gate"
          git push origin HEAD:m9-authority-replay-remediation
