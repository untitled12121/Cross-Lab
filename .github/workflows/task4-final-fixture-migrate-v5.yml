name: Task4 Final Fixture Migration V5

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Run complete Task 4 fixture migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          def replace_region(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          workflow = Path('.github/workflows/task4-final-fixture-migrate-v4.yml').read_text().splitlines()
          start = workflow.index("          python3 - <<'PY'") + 1
          end = workflow.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, '<task4-v4-migration>', 'exec'), {})

          path = Path('crates/core/tests/stream_resource_hardening.rs')
          text = path.read_text()
          old_import = '    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerId, OwnerRootRecord,\n'
          new_import = '    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerAuthorityState, OwnerId,\n    OwnerRootRecord,\n'
          text = replace_one(text, old_import, new_import, 'stream_resource_hardening import')

          setup = '\n'.join([
              '        let mut authority = OwnerAuthorityState::new(root);',
              '        authority.accept_delegation(delegation).unwrap();',
              '        let initiator_key = SigningKey::from_secret_bytes([0xe6; 32]);',
              '        let responder_key = SigningKey::from_secret_bytes([0xe7; 32]);',
              '        let initiator_credential = DeviceCredential::issue_current(',
              '            owner_id,',
              '            DeviceId::from_bytes([0xe8; 32]),',
              '            &initiator_key,',
              '            1,',
              '            &authority,',
              '            &issuer_key,',
              '        )',
              '        .unwrap();',
              '        let responder_device_id = DeviceId::from_bytes([0xe9; 32]);',
              '        let responder_initial_credential = DeviceCredential::issue_current(',
              '            owner_id,',
              '            responder_device_id,',
              '            &responder_key,',
              '            0,',
              '            &authority,',
              '            &issuer_key,',
              '        )',
              '        .unwrap();',
              '        let responder_credential = DeviceCredential::issue_current(',
              '            owner_id,',
              '            responder_device_id,',
              '            &responder_key,',
              '            1,',
              '            &authority,',
              '            &issuer_key,',
              '        )',
              '        .unwrap();',
              '        let transition = PairingTrustTransition::issue_current(',
              '            &responder_initial_credential,',
              '            TransitionId::from_bytes([0xea; 32]),',
              '            [0xf1; 32],',
              '            &authority,',
              '            &issuer_key,',
              '        )',
              '        .unwrap();',
              '        let mut peer_trust = transition',
              '            .establish_current(&responder_initial_credential, &authority)',
              '            .unwrap();',
              '        peer_trust',
              '            .accept_successor_credential_current(',
              '                &responder_credential,',
              '                &authority,',
              '                TransitionId::from_bytes([0xf2; 32]),',
              '            )',
              '            .unwrap();',
              '',
          ])
          text = replace_region(
              text,
              '        let initiator_key = SigningKey::from_secret_bytes([0xe6; 32]);',
              '        let ranges = [ProtocolRange::new(1, 0, 0).unwrap()];',
              setup,
          )
          text = replace_one(text, '                &root,', '                &authority,', 'stream activation authority')
          text = replace_one(
              text,
              '                SessionHandshakeSide::new(&initiator_credential, &delegation, &ranges, &features),',
              '                SessionHandshakeSide::new(&initiator_credential, &ranges, &features),',
              'stream initiator handshake',
          )
          text = replace_one(
              text,
              '                SessionHandshakeSide::new(&responder_credential, &delegation, &ranges, &features),',
              '                SessionHandshakeSide::new(&responder_credential, &ranges, &features),',
              'stream responder handshake',
          )
          path.write_text(text)
          PY
          cargo fmt
          cargo check -p crosslab-sim --test session_scenarios --all-features
          cargo check -p crosslab-sim --test m5_scenarios --all-features
          cargo check -p crosslab-core --test pairing_initial_epoch --all-features
          cargo check -p crosslab-core --test control_replay --all-features
          cargo check -p crosslab-core --test pairing_expiry_flow --all-features
          cargo check -p crosslab-core --test stream_resource_hardening --all-features
          cargo check --workspace --all-targets --all-features
          rm .github/workflows/task4-final-fixture-migrate.yml
          rm .github/workflows/task4-final-fixture-migrate-v2.yml
          rm .github/workflows/task4-final-fixture-migrate-v3.yml
          rm .github/workflows/task4-final-fixture-migrate-v4.yml
          rm .github/workflows/task4-final-fixture-migrate-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: migrate final task 4 authority fixtures"
          git push origin HEAD:m9-authority-replay-remediation
