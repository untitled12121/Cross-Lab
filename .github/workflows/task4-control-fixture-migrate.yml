name: Task4 Control Fixture Migration

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Migrate control lifecycle fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/sim/tests/control_lifecycle.rs')
          text = path.read_text()

          old_import = '    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerId, OwnerRootRecord,\n'
          new_import = '    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerAuthorityState, OwnerId,\n    OwnerRootRecord,\n'
          if old_import not in text:
              raise SystemExit('identity import shape changed')
          text = text.replace(old_import, new_import, 1)

          def replace_region(start_marker: str, end_marker: str, replacement: str) -> None:
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + replacement + text[end:]

          replace_region(
              'fn establish_trust(',
              '\n\nstruct Fixture',
              '''fn establish_trust(
              credential: &DeviceCredential,
              authority: &OwnerAuthorityState,
              issuer_key: &SigningKey,
              transition_byte: u8,
          ) -> TrustRecord {
              let initial_credential = DeviceCredential::issue_for_public_key_current(
                  credential.owner_id(),
                  credential.device_id(),
                  credential.device_public_key(),
                  0,
                  authority,
                  issuer_key,
              )
              .unwrap();
              let transition = PairingTrustTransition::issue_current(
                  &initial_credential,
                  TransitionId::from_bytes([transition_byte; 32]),
                  [transition_byte.wrapping_add(1); 32],
                  authority,
                  issuer_key,
              )
              .unwrap();
              let mut trust = transition
                  .establish_current(&initial_credential, authority)
                  .unwrap();

              for epoch in 1..=credential.credential_epoch() {
                  let successor = DeviceCredential::issue_for_public_key_current(
                      credential.owner_id(),
                      credential.device_id(),
                      credential.device_public_key(),
                      epoch,
                      authority,
                      issuer_key,
                  )
                  .unwrap();
                  let mut transition_id = [transition_byte; 32];
                  transition_id[..8].copy_from_slice(&epoch.to_be_bytes());
                  trust
                      .accept_successor_credential_current(
                          &successor,
                          authority,
                          TransitionId::from_bytes(transition_id),
                      )
                      .unwrap();
              }

              trust
          }''',
          )

          replace_region(
              'struct Fixture {',
              '\n}\n\nimpl Fixture',
              '''struct Fixture {
              owner_id: OwnerId,
              root_key: SigningKey,
              authority: OwnerAuthorityState,
              issuer_key: SigningKey,
              initiator_key: SigningKey,
              responder_key: SigningKey,
              initiator_credential: DeviceCredential,
              responder_credential: DeviceCredential,
              initiator_trust: TrustRecord,
              responder_trust: TrustRecord,
          }''',
          )

          replace_region(
              '    fn new() -> Self {',
              '\n\n    fn sessions',
              '''    fn new() -> Self {
              let owner_id = OwnerId::from_bytes([0xb0; 32]);
              let root_key = SigningKey::from_secret_bytes([0xb1; 32]);
              let root = OwnerRootRecord::new(owner_id, &root_key, 0);
              let issuer_key = SigningKey::from_secret_bytes([0xb2; 32]);
              let delegation = AuthorityDelegation::issue(
                  owner_id,
                  AuthorityRole::DeviceSigning,
                  &issuer_key,
                  0,
                  &root_key,
              );
              let mut authority = OwnerAuthorityState::new(root);
              authority.accept_delegation(delegation).unwrap();
              let initiator_key = SigningKey::from_secret_bytes([0xb3; 32]);
              let responder_key = SigningKey::from_secret_bytes([0xb4; 32]);
              let initiator_credential = DeviceCredential::issue_current(
                  owner_id,
                  DeviceId::from_bytes([0xb5; 32]),
                  &initiator_key,
                  1,
                  &authority,
                  &issuer_key,
              )
              .unwrap();
              let responder_credential = DeviceCredential::issue_current(
                  owner_id,
                  DeviceId::from_bytes([0xb6; 32]),
                  &responder_key,
                  1,
                  &authority,
                  &issuer_key,
              )
              .unwrap();
              let initiator_trust =
                  establish_trust(&initiator_credential, &authority, &issuer_key, 0xb7);
              let responder_trust =
                  establish_trust(&responder_credential, &authority, &issuer_key, 0xb8);

              Self {
                  owner_id,
                  root_key,
                  authority,
                  issuer_key,
                  initiator_key,
                  responder_key,
                  initiator_credential,
                  responder_credential,
                  initiator_trust,
                  responder_trust,
              }
          }''',
          )

          replace_region(
              '    fn sessions(&self, pair: &MemoryTransportPair)',
              '\n\n    fn revoke',
              '''    fn sessions(&self, pair: &MemoryTransportPair) -> (LogicalSession, LogicalSession) {
              let ranges = [ProtocolRange::new(1, 0, 0).unwrap()];
              let features = FeatureSet::new(&[], &[]).unwrap();
              let binding = pair.endpoints().0.channel_binding();
              let initiator_nonce = [0xb9; 32];
              let responder_nonce = [0xba; 32];
              let transcript = SessionAuthTranscriptV1::new(
                  self.owner_id,
                  &self.initiator_credential,
                  initiator_nonce,
                  &self.responder_credential,
                  responder_nonce,
                  ProtocolVersion::new(1, 0),
                  &[],
                  binding.profile_id().as_bytes(),
                  binding.bytes(),
              )
              .unwrap();
              let initiator_proof = transcript
                  .create_proof(SessionAuthRole::Initiator, &self.initiator_key)
                  .unwrap();
              let responder_proof = transcript
                  .create_proof(SessionAuthRole::Responder, &self.responder_key)
                  .unwrap();
              let initiator =
                  SessionHandshakeSide::new(&self.initiator_credential, &ranges, &features);
              let responder =
                  SessionHandshakeSide::new(&self.responder_credential, &ranges, &features);

              let mut a = LogicalSession::new();
              a.authenticate(SessionActivation::new(
                  &self.authority,
                  initiator,
                  responder,
                  SessionAuthRole::Initiator,
                  &self.responder_trust,
                  initiator_nonce,
                  responder_nonce,
                  binding,
                  TransportSecurityClass::InProcessTest,
                  &initiator_proof,
                  &responder_proof,
              ))
              .unwrap();

              let mut b = LogicalSession::new();
              b.authenticate(SessionActivation::new(
                  &self.authority,
                  initiator,
                  responder,
                  SessionAuthRole::Responder,
                  &self.initiator_trust,
                  initiator_nonce,
                  responder_nonce,
                  binding,
                  TransportSecurityClass::InProcessTest,
                  &initiator_proof,
                  &responder_proof,
              ))
              .unwrap();

              (a, b)
          }''',
          )

          replace_region(
              '    fn revoke(&self, record: TrustRecord, transition_byte: u8)',
              '\n    }\n}\n\nfn pair',
              '''    fn revoke(&self, record: TrustRecord, transition_byte: u8) -> TrustRecord {
              let transition = TrustTransition::issue_root_revocation(
                  &record,
                  TransitionId::from_bytes([transition_byte; 32]),
                  self.authority.root(),
                  &self.root_key,
              )
              .unwrap();
              let mut revoked = record;
              transition
                  .apply_root(&mut revoked, self.authority.root())
                  .unwrap();
              revoked
          }''',
          )

          wrong_start = '#[test]\nfn wrong_peer_revocation_cannot_terminate_an_unrelated_session() {'
          next_test = '\n\n#[test]\nfn shutdown_is_idempotent_and_discards_pending_authority()'
          replace_region(
              wrong_start,
              next_test,
              '''#[test]
          fn wrong_peer_revocation_cannot_terminate_an_unrelated_session() {
              let fixture = Fixture::new();
              let wrong_credential = DeviceCredential::issue_current(
                  fixture.owner_id,
                  DeviceId::from_bytes([0xc4; 32]),
                  &SigningKey::from_secret_bytes([0xcd; 32]),
                  fixture.initiator_credential.credential_epoch(),
                  &fixture.authority,
                  &fixture.issuer_key,
              )
              .unwrap();
              let wrong = establish_trust(
                  &wrong_credential,
                  &fixture.authority,
                  &fixture.issuer_key,
                  0xc5,
              );
              let wrong = fixture.revoke(wrong, 0xc6);
              let pair = pair();
              let (_, session_b) = fixture.sessions(&pair);
              let (_, endpoint_b) = pair.endpoints();
              let mut node = SimNode::new(
                  session_b,
                  endpoint_b,
                  PolicyState::new(),
                  Vec::new(),
                  NetworkClass::Local,
                  NonZeroUsize::new(CAPACITY).unwrap(),
              )
              .unwrap();

              assert!(matches!(
                  node.apply_peer_revocation(&wrong),
                  Err(NodeError::Session(SessionError::PeerTrustMismatch))
              ));
              assert_eq!(node.session().state(), SessionState::Active);
              assert!(!endpoint_b.is_closed());
          }''',
          )

          for obsolete in ('&fixture.root', '&fixture.delegation', '&self.root', '&self.delegation'):
              if obsolete in text:
                  raise SystemExit(f'obsolete session authority reference remains: {obsolete}')

          path.write_text(text)
          PY
          cargo fmt
          cargo check -p crosslab-sim --test control_lifecycle --all-features
          rm .github/workflows/task4-control-fixture-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(sim): migrate control lifecycle authority fixture"
          git push origin HEAD:m9-authority-replay-remediation
