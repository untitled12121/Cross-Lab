name: M9 lockfile sync

on:
  push:
    branches:
      - m9-remote-networking

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m9-remote-networking
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh M9 Iroh lockfile"
          git push origin HEAD:m9-remote-networking
