name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang gcc g++ \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev libvulkan1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Verify lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Validate theme JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(
              [*Path("design/schema").glob("*.json"),
               *Path("design/themes").glob("*.json"),
               *Path("design/fixtures").glob("*.json")]
          )
          if not paths:
              raise SystemExit("no theme JSON files found")
          for path in paths:
              with path.open("r", encoding="utf-8") as source:
                  json.load(source)
              print(f"validated {path}")
          PY
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features
      - name: Enforce mobile FFI unsafe boundary
        run: |
          if grep -REn --include='*.rs' '(^|[^[:alnum:]_])unsafe[[:space:]]*(\{|fn|impl|trait)' crates/mobile-ffi/src; then
            echo "handwritten unsafe is not allowed in crates/mobile-ffi" >&2
            exit 1
          fi
      - name: Generate UniFFI Kotlin bindings
        run: |
          bash scripts/generate-mobile-bindings.sh "$RUNNER_TEMP/crosslab-uniffi-kotlin"
          find "$RUNNER_TEMP/crosslab-uniffi-kotlin" -type f -name '*.kt' -print -quit | grep -q .
      - name: Build Linux desktop
        run: cargo build -p crosslab-desktop --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
