name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang gcc g++ \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev libvulkan1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Verify lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Validate theme JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(
              [*Path("design/schema").glob("*.json"),
               *Path("design/themes").glob("*.json"),
               *Path("design/fixtures").glob("*.json")]
          )
          if not paths:
              raise SystemExit("no theme JSON files found")
          for path in paths:
              with path.open("r", encoding="utf-8") as source:
                  json.load(source)
              print(f"validated {path}")
          PY
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features
      - name: Enforce mobile FFI unsafe boundary
        run: |
          if grep -REn --include='*.rs' '(^|[^[:alnum:]_])unsafe[[:space:]]*(\{|fn|impl|trait)' crates/mobile-ffi/src; then
            echo "handwritten unsafe is not allowed in crates/mobile-ffi" >&2
            exit 1
          fi
      - name: Generate UniFFI Kotlin bindings
        run: |
          bash scripts/generate-mobile-bindings.sh "$RUNNER_TEMP/crosslab-uniffi-kotlin"
          find "$RUNNER_TEMP/crosslab-uniffi-kotlin" -type f -name '*.kt' -print -quit | grep -q .
      - name: Build Linux desktop
        run: cargo build -p crosslab-desktop --locked
      - name: Build Linux desktop development slice
        run: cargo build -p crosslab-desktop --locked --features development-provisioning
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless
      - name: Install Android CLI and SDK components
        run: |
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | \
            sudo tee /etc/apt/keyrings/google.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] http://dl.google.com/android/cli/latest/debian/ stable main" | \
            sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends android-cli

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          yes | android --no-metrics --sdk="${sdk_root}" sdk install \
            platforms/android-37.0
          yes | android --no-metrics --sdk="${sdk_root}" sdk install \
            build-tools/36.0.0 \
            ndk/28.2.13676358

          test -f "${sdk_root}/platforms/android-37.0/android.jar"
          test -d "${sdk_root}/ndk/28.2.13676358"
          echo "ANDROID_NDK_ROOT=${sdk_root}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Rust Android target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup target add aarch64-linux-android --toolchain 1.98.1
      - name: Verify Gradle wrapper
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --version --no-daemon
      - name: Android unit tests
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Android debug assembly
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Android development wiring assembly
        working-directory: apps/android
        run: |
          ./gradlew :app:assembleDebug \
            -PcrosslabDevelopmentProvisioning=true \
            --no-daemon \
            --stacktrace

