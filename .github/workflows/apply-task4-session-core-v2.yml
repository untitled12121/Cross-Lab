name: Apply Task4 session core migration v2

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Apply session migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/core/src/session/state.rs")
          s = path.read_text()

          def replace(old, new, count=1):
              global s
              actual = s.count(old)
              assert actual == count, (old[:100], actual, count)
              s = s.replace(old, new)

          replace(
          '''use crosslab_identity::{
              AuthorityDelegation, DeviceCredential, DeviceId, IdentityError, OwnerId, OwnerRootRecord,
          };''',
          '''use crosslab_identity::{
              AuthorityRole, DeviceCredential, DeviceId, IdentityError, KeyId, OwnerAuthorityState, OwnerId,
          };''')

          replace(
          '''#[derive(Clone, Copy)]
          pub struct SessionHandshakeSide<'a> {
              credential: &'a DeviceCredential,
              issuer: &'a AuthorityDelegation,
              protocol_ranges: &'a [ProtocolRange],
              features: &'a FeatureSet,
          }

          impl<'a> SessionHandshakeSide<'a> {
              pub const fn new(
                  credential: &'a DeviceCredential,
                  issuer: &'a AuthorityDelegation,
                  protocol_ranges: &'a [ProtocolRange],
                  features: &'a FeatureSet,
              ) -> Self {
                  Self {
                      credential,
                      issuer,
                      protocol_ranges,
                      features,
                  }
              }
          }''',
          '''#[derive(Clone, Copy)]
          pub struct SessionHandshakeSide<'a> {
              credential: &'a DeviceCredential,
              protocol_ranges: &'a [ProtocolRange],
              features: &'a FeatureSet,
          }

          impl<'a> SessionHandshakeSide<'a> {
              pub const fn new(
                  credential: &'a DeviceCredential,
                  protocol_ranges: &'a [ProtocolRange],
                  features: &'a FeatureSet,
              ) -> Self {
                  Self {
                      credential,
                      protocol_ranges,
                      features,
                  }
              }
          }''')

          replace("    root: &'a OwnerRootRecord,", "    authority: &'a OwnerAuthorityState,", count=2)
          replace("            root,\n            initiator,", "            authority,\n            initiator,")

          replace(
          '''    PeerTrustRevisionNotAdvanced,
              Protocol(VersionNegotiationError),''',
          '''    PeerTrustRevisionNotAdvanced,
              OwnerAuthorityChanged,
              DeviceSigningAuthorityChanged,
              Protocol(VersionNegotiationError),''')

          replace(
          '''            Self::PeerTrustRevisionNotAdvanced => formatter
                      .write_str("peer trust revision does not advance the authenticated snapshot"),
                  Self::Protocol(error) => fmt::Display::fmt(error, formatter),''',
          '''            Self::PeerTrustRevisionNotAdvanced => formatter
                      .write_str("peer trust revision does not advance the authenticated snapshot"),
                  Self::OwnerAuthorityChanged => {
                      formatter.write_str("owner root authority changed since session authentication")
                  }
                  Self::DeviceSigningAuthorityChanged => formatter.write_str(
                      "device signing authority changed since session authentication",
                  ),
                  Self::Protocol(error) => fmt::Display::fmt(error, formatter),''')

          replace(
          '''    owner_id: OwnerId,
              peer_credential_epoch: u64,''',
          '''    owner_id: OwnerId,
              root_key_id: KeyId,
              root_epoch: u64,
              device_signing_key_id: KeyId,
              device_signing_epoch: u64,
              peer_credential_epoch: u64,''')

          replace(
          '''    pub const fn owner_id(&self) -> OwnerId {
                  self.owner_id
              }

              pub const fn peer_credential_epoch(&self) -> u64 {''',
          '''    pub const fn owner_id(&self) -> OwnerId {
                  self.owner_id
              }

              pub const fn root_key_id(&self) -> KeyId {
                  self.root_key_id
              }

              pub const fn root_epoch(&self) -> u64 {
                  self.root_epoch
              }

              pub const fn device_signing_key_id(&self) -> KeyId {
                  self.device_signing_key_id
              }

              pub const fn device_signing_epoch(&self) -> u64 {
                  self.device_signing_epoch
              }

              pub const fn peer_credential_epoch(&self) -> u64 {''')

          replace(
          '''fn authenticate(activation: SessionActivation<'_>) -> Result<SessionContext, SessionError> {
              activation.initiator.credential.verify(
                  activation.root,
                  activation.initiator.issuer,
                  0,
                  activation.initiator.issuer.delegation_epoch(),
              )?;
              activation.responder.credential.verify(
                  activation.root,
                  activation.responder.issuer,
                  0,
                  activation.responder.issuer.delegation_epoch(),
              )?;

              let (local, peer) = activation.local_and_peer();''',
          '''fn authenticate(activation: SessionActivation<'_>) -> Result<SessionContext, SessionError> {
              let authority = activation.authority;
              let root = authority.root();
              let device_signing = authority.current_delegation(AuthorityRole::DeviceSigning)?;
              activation.initiator.credential.verify_current(authority, 0)?;
              activation.responder.credential.verify_current(authority, 0)?;

              let (local, peer) = activation.local_and_peer();''')

          replace("        activation.root.owner_id(),", "        root.owner_id(),")
          replace(
          '''        owner_id: activation.root.owner_id(),
                  peer_credential_epoch: peer.credential.credential_epoch(),''',
          '''        owner_id: root.owner_id(),
                  root_key_id: root.root_key_id(),
                  root_epoch: root.root_epoch(),
                  device_signing_key_id: device_signing.delegated_key_id(),
                  device_signing_epoch: device_signing.delegation_epoch(),
                  peer_credential_epoch: peer.credential.credential_epoch(),''')

          replace(
          '''    use crosslab_identity::AuthorityRole;''',
          '''    use crosslab_identity::{AuthorityDelegation, AuthorityRole, OwnerRootRecord};''')

          replace(
          '''            owner_id,
                  peer_credential_epoch,
                  peer_trust_revision: revoked.trust_revision(),''',
          '''            owner_id,
                  root_key_id: root.root_key_id(),
                  root_epoch: root.root_epoch(),
                  device_signing_key_id: delegation.delegated_key_id(),
                  device_signing_epoch: delegation.delegation_epoch(),
                  peer_credential_epoch,
                  peer_trust_revision: revoked.trust_revision(),''')

          path.write_text(s)

          currentness = Path("crates/core/src/session/currentness.rs")
          c = currentness.read_text()
          old = '''use crosslab_policy::{TrustRecord, TrustState};

          use super::{LogicalSession, SessionError, SessionState};'''
          new = '''use crosslab_identity::{AuthorityRole, OwnerAuthorityState};
          use crosslab_policy::{TrustRecord, TrustState};

          use super::{LogicalSession, SessionError, SessionState};'''
          assert c.count(old) == 1
          c = c.replace(old, new)
          closing = '''        Ok(())
              }
          }
          '''
          assert c.endswith(closing)
          method = '''

              pub fn revalidate_authority(
                  &mut self,
                  authority: &OwnerAuthorityState,
              ) -> Result<(), SessionError> {
                  if self.state() != SessionState::Active {
                      return Err(SessionError::InvalidState);
                  }

                  let validation = {
                      let context = self.context().ok_or(SessionError::InvalidState)?;
                      let root = authority.root();
                      if root.owner_id() != context.owner_id()
                          || root.root_key_id() != context.root_key_id()
                          || root.root_epoch() != context.root_epoch()
                      {
                          Err(SessionError::OwnerAuthorityChanged)
                      } else {
                          match authority.current_delegation(AuthorityRole::DeviceSigning) {
                              Ok(delegation)
                                  if delegation.delegated_key_id()
                                      == context.device_signing_key_id()
                                      && delegation.delegation_epoch()
                                          == context.device_signing_epoch() =>
                              {
                                  Ok(())
                              }
                              _ => Err(SessionError::DeviceSigningAuthorityChanged),
                          }
                      }
                  };

                  if let Err(error) = validation {
                      let _ = self.begin_close();
                      let _ = self.finish_close();
                      return Err(error);
                  }

                  Ok(())
              }
          '''
          c = c[:-len(closing)] + '''        Ok(())
              }''' + method + '''
          }
          '''
          currentness.write_text(c)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit session migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-task4-session-core.yml
          git rm .github/workflows/apply-task4-session-core-v2.yml
          git add crates/core/src/session/state.rs crates/core/src/session/currentness.rs
          git commit -m "feat(core): enforce session authority currentness"
          git push origin HEAD:m9-authority-replay-remediation
