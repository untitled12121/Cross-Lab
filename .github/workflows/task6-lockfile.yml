name: Task 6 lockfile

on:
  push:
    branches:
      - m10-task6-linux-desktop-shell

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m10-task6-linux-desktop-shell
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update lockfile for GPUI shell"
          git push origin HEAD:m10-task6-linux-desktop-shell
