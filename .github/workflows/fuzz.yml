name: Fuzz Smoke

on:
  pull_request:
    paths:
      - "crates/protocol/**"
      - "crates/policy/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Protocol Parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install nightly Rust
        run: rustup toolchain install nightly-2026-09-12 --profile minimal --component rustfmt
      - name: Verify fuzz lockfile
        run: cargo +nightly-2026-09-12 metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1 > /dev/null
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-09-12 install cargo-fuzz --version 0.13.2 --locked
      - name: Format fuzz targets
        run: cargo +nightly-2026-09-12 fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Run bounded fuzz smoke
        run: |
          cargo +nightly-2026-09-12 fuzz run control_frame -- -runs=256
          cargo +nightly-2026-09-12 fuzz run data_stream_open -- -runs=256
          cargo +nightly-2026-09-12 fuzz run identifiers -- -runs=256
          cargo +nightly-2026-09-12 fuzz run pairing_bootstrap -- -runs=256
          cargo +nightly-2026-09-12 fuzz run session_auth -- -runs=256
