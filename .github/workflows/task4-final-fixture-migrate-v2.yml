name: Task4 Final Fixture Migration V2

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Run corrected Task 4 migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/task4-final-fixture-migrate.yml').read_text().splitlines()
          start = workflow.index("          python3 - <<'PY'") + 1
          end = workflow.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])

          stale_exact = "text = one(text, stale_old, stale_new, 'm5 stale credential test')"
          stale_region = "text = region(text, '    let newer_credential = DeviceCredential::issue_for_public_key(', '\\n    let pair = transport_pair([0x81; 32]);', stale_new)"
          wrong_exact = "text = one(text, wrong_old, wrong_new, 'm5 wrong-owner test')"
          wrong_region = "text = region(text, '    let wrong_delegation = AuthorityDelegation::issue(', '\\n    let pair = transport_pair([0x92; 32]);', wrong_new)"

          if script.count(stale_exact) != 1 or script.count(wrong_exact) != 1:
              raise SystemExit('task 4 migration script shape changed')
          script = script.replace(stale_exact, stale_region, 1)
          script = script.replace(wrong_exact, wrong_region, 1)
          exec(compile(script, '<task4-migration>', 'exec'), {})
          PY
          cargo fmt
          cargo check -p crosslab-sim --test session_scenarios --all-features
          cargo check -p crosslab-sim --test m5_scenarios --all-features
          cargo check --workspace --all-targets --all-features
          rm .github/workflows/task4-final-fixture-migrate.yml
          rm .github/workflows/task4-final-fixture-migrate-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(sim): migrate final task 4 authority fixtures"
          git push origin HEAD:m9-authority-replay-remediation
