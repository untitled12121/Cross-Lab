name: Pairing Android Lock Maintenance

on:
  push:
    branches:
      - product-pairing-ui
    paths:
      - .github/workflows/pairing-android-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product-pairing-ui
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Resolve Android target lock graph
        run: cargo metadata --filter-platform aarch64-linux-android --format-version 1 >/dev/null
      - name: Commit generated lockfile and remove maintenance workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pairing-android-lock.yml
          git add Cargo.lock
          git diff --cached --check
          git commit -m "build(android): resolve pairing target lock graph"
          git push origin HEAD:product-pairing-ui
