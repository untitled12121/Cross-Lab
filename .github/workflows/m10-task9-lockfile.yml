name: M10 Task 9 Lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m10-task9-runtime-quinn-wiring
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "build: refresh Task 9 lockfile [skip ci]"
          git push origin HEAD:m10-task9-runtime-quinn-wiring
