name: Repair Cargo lock

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Repair and validate lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.lock")
          content = path.read_text()
          bad = "e67ba7e9b2b56446f1d419b1d807906278ffa1a6588a5d8a39dcb1f5a78614f"
          good = "e67ba7e9b2b56446f1d419b1d807906278ffa1a658a8a5d8a39dcb1f5a78614f"
          assert content.count(bad) == 1
          path.write_text(content.replace(bad, good))
          PY
          cargo update -p rustls --precise 0.23.45
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check
      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): repair generated rustls lockfile"
          git push origin HEAD:m9-authority-replay-remediation
