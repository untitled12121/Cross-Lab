name: M10 Task 10 Rustfmt

on:
  pull_request:

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m10-task10-real-device-evidence
      - name: Install Rustfmt
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Apply rustfmt
        run: cargo fmt
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.rs' '**/*.rs'
          git commit -m "style(m10): apply real-device evidence rustfmt"
          git push origin HEAD:m10-task10-real-device-evidence
