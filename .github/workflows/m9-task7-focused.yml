name: M9 Task 7 Focused

on:
  push:
    branches:
      - m9-task7-owner-relay-path

permissions:
  contents: read

jobs:
  relay:
    name: Owner Relay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Focused relay test
        run: cargo test -p crosslab-m9-networking --test relay
