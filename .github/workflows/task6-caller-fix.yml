name: Task 6 Caller Fix

on:
  push:
    branches:
      - m9-authority-replay-remediation
    paths:
      - .github/workflows/task6-caller-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Migrate remaining Task 6 callers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          path = "apps/sim/tests/lifecycle.rs"
          replace_exact(
              path,
              "    fn old_operation(&self, session: &LogicalSession) -> (AuthorizedOperation, u64, u64) {",
              "    fn old_operation(&self, session: &LogicalSession) -> (AuthorizedOperation, PolicyState) {",
          )
          replace_exact(
              path,
              "        (\n            AuthorizedOperation::issue(grant, 10, 20, UsePolicy::SingleStream).unwrap(),\n            self.initiator_trust.trust_revision(),\n            policy.revision(),\n        )",
              "        (\n            AuthorizedOperation::issue(grant, 10, 20, UsePolicy::SingleStream).unwrap(),\n            policy,\n        )",
          )
          replace_exact(
              path,
              "    let (old_operation, trust_revision, policy_revision) = fixture.old_operation(&old_b);",
              "    let (old_operation, policy) = fixture.old_operation(&old_b);",
          )
          replace_exact(
              path,
              "        admission.admit_inbound(&new_b, &open, 15, trust_revision, policy_revision,),",
              "        admission.admit_inbound(\n            &new_b,\n            &open,\n            15,\n            &fixture.initiator_trust,\n            &policy,\n        ),",
          )
          replace_exact(
              path,
              "    let (operation, trust_revision, policy_revision) = fixture.old_operation(&receiver_session);",
              "    let (operation, policy) = fixture.old_operation(&receiver_session);",
          )
          replace_exact(
              path,
              "    let stream_id = receiver\n        .accept_one(15, trust_revision, policy_revision)\n        .unwrap();",
              "    let stream_id = receiver\n        .accept_one(15, &fixture.initiator_trust, &policy)\n        .unwrap();",
          )

          path = "transports/quic/src/session_auth_tests/lifecycle_tests.rs"
          replace_exact(
              path,
              "    operation: AuthorizedOperation,\n    trust_revision: u64,\n    policy_revision: u64,\n    session_id: crosslab_policy::SessionId,",
              "    operation: AuthorizedOperation,\n    peer_trust: TrustRecord,\n    policy: PolicyState,\n    session_id: crosslab_policy::SessionId,",
          )
          replace_exact(
              path,
              "        trust_revision,\n        policy_revision,\n        session_id,",
              "        peer_trust: fixture.initiator_trust,\n        policy,\n        session_id,",
          )
          p = Path(path)
          text = p.read_text()
          for old, new in [
              ("authority.trust_revision", "&authority.peer_trust"),
              ("authority.policy_revision", "&authority.policy"),
          ]:
              count = text.count(old)
              if count != 3:
                  raise SystemExit(f"{path}: expected three {old} call sites, found {count}")
              text = text.replace(old, new)
          p.write_text(text)
          replace_exact(
              path,
              "    assert!(matches!(\n        eventually_accept(&mut receiver, 15, 0, 0).await,",
              "    let policy = PolicyState::new();\n    assert!(matches!(\n        eventually_accept(&mut receiver, 15, &fixture.initiator_trust, &policy).await,",
          )
          replace_exact(
              path,
              "async fn eventually_accept(\n    runtime: &mut SimStreamRuntime<'_>,\n    now: u64,\n    trust_revision: u64,\n    policy_revision: u64,\n) -> Result<StreamId, SimStreamError> {",
              "async fn eventually_accept(\n    runtime: &mut SimStreamRuntime<'_>,\n    now: u64,\n    peer_trust: &TrustRecord,\n    policy: &PolicyState,\n) -> Result<StreamId, SimStreamError> {",
          )
          replace_exact(
              path,
              "            match runtime.accept_one(now, trust_revision, policy_revision) {",
              "            match runtime.accept_one(now, peer_trust, policy) {",
          )
          PY
          rm .github/workflows/task6-caller-fix.yml
          cargo fmt --all
      - name: Verify Task 6
        run: |
          cargo test -p crosslab-core --test stream_admission
          cargo test -p crosslab-sim --all-features
          cargo test -p crosslab-transport-quic --all-features
          cargo fmt --check
      - name: Commit Task 6 completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/sim/tests/lifecycle.rs transports/quic/src/session_auth_tests/lifecycle_tests.rs .github/workflows/task6-caller-fix.yml
          git commit -m "fix(core): finish local stream currentness migration"
          git push origin HEAD:m9-authority-replay-remediation
