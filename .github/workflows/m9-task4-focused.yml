name: M9 Task 4 Focused

on:
  push:
    branches:
      - m9-task4-iroh-stream-bridge

permissions:
  contents: read

jobs:
  stream:
    name: Iroh Stream Bridge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Focused candidate tests
        run: cargo test -p crosslab-m9-networking --lib --test control --test stream
