name: Task4 Final Fixture Migration V6

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Run complete Task 4 fixture migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          workflow = Path('.github/workflows/task4-final-fixture-migrate-v5.yml').read_text().splitlines()
          start = workflow.index("          python3 - <<'PY'") + 1
          end = workflow.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, '<task4-v5-migration>', 'exec'), {})

          path = Path('crates/core/tests/stream_admission.rs')
          text = path.read_text()
          old_import = '    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerId, OwnerRootRecord,\n'
          new_import = '    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerAuthorityState, OwnerId,\n    OwnerRootRecord,\n'
          text = replace_one(text, old_import, new_import, 'stream_admission import')
          anchor = '        let peer_trust =\n            establish_trust(&responder_credential, &root, &delegation, &issuer_key, 0x17);\n'
          replacement = anchor + '        let mut authority = OwnerAuthorityState::new(root);\n        authority.accept_delegation(delegation).unwrap();\n'
          text = replace_one(text, anchor, replacement, 'stream_admission authority state')
          text = replace_one(
              text,
              '        let activation = SessionActivation::new(\n            &root,\n',
              '        let activation = SessionActivation::new(\n            &authority,\n',
              'stream_admission activation authority',
          )
          text = replace_one(
              text,
              '            SessionHandshakeSide::new(&initiator_credential, &delegation, &ranges, &features),',
              '            SessionHandshakeSide::new(&initiator_credential, &ranges, &features),',
              'stream_admission initiator handshake',
          )
          text = replace_one(
              text,
              '            SessionHandshakeSide::new(&responder_credential, &delegation, &ranges, &features),',
              '            SessionHandshakeSide::new(&responder_credential, &ranges, &features),',
              'stream_admission responder handshake',
          )
          path.write_text(text)

          path = Path('crates/core/tests/pairing_flow_vectors.rs')
          text = path.read_text()
          old_import = 'use crosslab_identity::{AuthorityDelegation, AuthorityRole, DeviceId, OwnerId, OwnerRootRecord};'
          new_import = 'use crosslab_identity::{\n    AuthorityDelegation, AuthorityRole, DeviceId, OwnerAuthorityState, OwnerId, OwnerRootRecord,\n};'
          text = replace_one(text, old_import, new_import, 'pairing_flow_vectors import')
          delegation_setup = '\n'.join([
              '    let delegation = AuthorityDelegation::issue(',
              '        owner_id,',
              '        AuthorityRole::DeviceSigning,',
              '        &issuer_key,',
              '        0,',
              '        &root_key,',
              '    );',
          ])
          authority_setup = delegation_setup + '\n    let mut authority = OwnerAuthorityState::new(root);\n    authority.accept_delegation(delegation).unwrap();'
          text = replace_one(text, delegation_setup, authority_setup, 'pairing_flow_vectors authority state')
          old_issue = '\n'.join([
              '        .issue_initial_joiner_credential(',
              '            &root,',
              '            &delegation,',
              '            &issuer_key,',
              '            PairingInstant::from_ticks(20),',
              '        )',
          ])
          new_issue = '\n'.join([
              '        .issue_initial_joiner_credential(',
              '            &authority,',
              '            &issuer_key,',
              '            PairingInstant::from_ticks(20),',
              '        )',
          ])
          text = replace_one(text, old_issue, new_issue, 'pairing_flow_vectors issue')
          text = replace_one(
              text,
              '        .accept_credential(&root, &delegation, &credential, &joiner_key)',
              '        .accept_credential(&authority, &credential, &joiner_key)',
              'pairing_flow_vectors accept',
          )
          path.write_text(text)
          PY
          cargo fmt
          cargo check -p crosslab-sim --test session_scenarios --all-features
          cargo check -p crosslab-sim --test m5_scenarios --all-features
          cargo check -p crosslab-core --test pairing_initial_epoch --all-features
          cargo check -p crosslab-core --test control_replay --all-features
          cargo check -p crosslab-core --test pairing_expiry_flow --all-features
          cargo check -p crosslab-core --test stream_resource_hardening --all-features
          cargo check -p crosslab-core --test stream_admission --all-features
          cargo check -p crosslab-core --test pairing_flow_vectors --all-features
          cargo check --workspace --all-targets --all-features
          rm .github/workflows/task4-final-fixture-migrate.yml
          rm .github/workflows/task4-final-fixture-migrate-v2.yml
          rm .github/workflows/task4-final-fixture-migrate-v3.yml
          rm .github/workflows/task4-final-fixture-migrate-v4.yml
          rm .github/workflows/task4-final-fixture-migrate-v5.yml
          rm .github/workflows/task4-final-fixture-migrate-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: migrate final task 4 authority fixtures"
          git push origin HEAD:m9-authority-replay-remediation
