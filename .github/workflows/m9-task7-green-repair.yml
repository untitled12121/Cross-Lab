name: M9 Task 7 Invariant Repair

on:
  push:
    branches:
      - m9-task7-owner-relay-path

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Reuse Task 6 authority fixtures for Task 7 invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle = Path('experiments/m9-networking/src/scenarios/lifecycle.rs')
          text = lifecycle.read_text()
          text = text.replace('struct StreamAuthority {', 'pub(crate) struct StreamAuthority {', 1)
          anchor = '''struct StreamContext {
              capability: CapabilityId,
          '''
          methods = '''impl StreamAuthority {
              pub(crate) fn operation(&self) -> &AuthorizedOperation {
                  &self.operation
              }

              pub(crate) fn peer_trust(&self) -> &TrustRecord {
                  &self.peer_trust
              }

              pub(crate) fn policy(&self) -> &PolicyState {
                  &self.policy
              }

              pub(crate) fn open(&self, stream_id: StreamId) -> DataStreamOpen {
                  stream_open(self, self.operation.id(), stream_id)
              }
          }

          struct StreamContext {
              capability: CapabilityId,
          '''
          if text.count(anchor) != 1:
              raise SystemExit('StreamContext anchor mismatch')
          text = text.replace(anchor, methods, 1)
          text = text.replace(
              'fn prepare_stream_authority(\n',
              'pub(crate) fn prepare_stream_authority(\n',
              1,
          )
          text = text.replace(
              'async fn eventually_accept(\n',
              'pub(crate) async fn eventually_accept(\n',
              1,
          )
          text = text.replace(
              'async fn eventually_receive(runtime: &mut SimStreamRuntime',
              'pub(crate) async fn eventually_receive(runtime: &mut SimStreamRuntime',
              1,
          )
          text = text.replace(
              'async fn eventually_finished(runtime: &mut SimStreamRuntime',
              'pub(crate) async fn eventually_finished(runtime: &mut SimStreamRuntime',
              1,
          )
          lifecycle.write_text(text)

          relay = Path('experiments/m9-networking/src/scenarios/relay.rs')
          text = relay.read_text()
          text = text.replace(
              'use std::time::Duration;',
              'use std::{num::NonZeroUsize, time::Duration};',
              1,
          )
          text = text.replace(
              'use crosslab_core::{ChannelBinding, TransportConnection};',
              'use crosslab_core::{ChannelBinding, ControlReceiveError, TransportConnection};',
              1,
          )
          text = text.replace(
              'use crosslab_policy::{NetworkClass, SessionId};',
              'use crosslab_policy::{NetworkClass, PolicyState, SessionId, TrustRecord};',
              1,
          )
          text = text.replace(
              'use futures_util::StreamExt;',
              'use crosslab_protocol::{CapabilityAdvertisement, StreamId};\nuse crosslab_sim::{\n    node::{NodeError, NodeEvent, SimNode},\n    stream::SimStreamRuntime,\n};\nuse futures_util::StreamExt;',
              1,
          )
          text = text.replace(
              'scenarios::auth::{AuthFixture, AuthenticatedIrohPair, authenticate_connected_pair},',
              '''scenarios::{
                  auth::{
                      AuthFixture, AuthenticatedIrohPair, AuthenticatedIrohParts,
                      authenticate_connected_pair,
                  },
                  lifecycle::{
                      eventually_accept, eventually_finished, eventually_receive,
                      prepare_stream_authority,
                  },
              },''',
              1,
          )
          old_method = '''    pub async fn wait_for_direct_path(&mut self, wait: Duration) -> Result<(), EvalError> {
                  let mut paths = self.observed_connection.paths_stream();
                  timeout(wait, async {
                      while let Some(paths) = paths.next().await {
                          if paths.iter().any(|path| path.remote_addr().is_ip()) {
                              return Ok(());
                          }
                      }
                      Err(EvalError::Connect)
                  })
                  .await
                  .map_err(|_| EvalError::Timeout)?
              }
          '''
          new_method = '''    pub async fn wait_for_direct_path(&mut self, wait: Duration) -> Result<(), EvalError> {
                  wait_for_direct_path_on(&self.observed_connection, wait).await
              }
          '''
          if text.count(old_method) != 1:
              raise SystemExit('wait_for_direct_path anchor mismatch')
          text = text.replace(old_method, new_method, 1)

          insert_before = '''async fn connect_relay_pair(
          '''
          helpers = '''pub struct RelaySequenceEvidence {
              pub before_send_sequence: Option<u64>,
              pub before_receive_sequence: Option<u64>,
              pub after_send_sequence: Option<u64>,
              pub after_receive_sequence: Option<u64>,
          }

          pub async fn exercise_relay_sequence_invariant(
              fixture: &AuthFixture,
          ) -> Result<RelaySequenceEvidence, EvalError> {
              let RelayObservedPair {
                  relay,
                  pair,
                  observed_connection,
              } = relay_then_direct_pair(fixture).await?;
              let AuthenticatedIrohParts {
                  direct,
                  client_transport,
                  server_transport,
                  client_session,
                  server_session,
              } = pair.into_parts();
              let capacity = NonZeroUsize::new(16).expect("nonzero Task 7 state capacity");
              let mut client = SimNode::new(
                  client_session,
                  &client_transport,
                  PolicyState::new(),
                  Vec::new(),
                  NetworkClass::Remote,
                  capacity,
              )
              .map_err(|_| EvalError::Control)?;
              let mut server = SimNode::new(
                  server_session,
                  &server_transport,
                  PolicyState::new(),
                  Vec::new(),
                  NetworkClass::Remote,
                  capacity,
              )
              .map_err(|_| EvalError::Control)?;
              let peer_trust = fixture.initiator_trust();

              send_empty_capabilities(&mut client)?;
              wait_for_capability_update(&mut server, &peer_trust).await?;
              let before_send_sequence = client.next_send_sequence();
              let before_receive_sequence = server.expected_receive_sequence();

              wait_for_direct_path_on(&observed_connection, RELAY_READY_TIMEOUT).await?;

              send_empty_capabilities(&mut client)?;
              wait_for_capability_update(&mut server, &peer_trust).await?;
              let after_send_sequence = client.next_send_sequence();
              let after_receive_sequence = server.expected_receive_sequence();

              client.shutdown();
              server.shutdown();
              drop((client, server));
              tokio::join!(client_transport.shutdown(), server_transport.shutdown());
              direct.shutdown().await;
              relay.shutdown().await?;

              Ok(RelaySequenceEvidence {
                  before_send_sequence,
                  before_receive_sequence,
                  after_send_sequence,
                  after_receive_sequence,
              })
          }

          pub async fn exercise_relay_operation_invariant(
              fixture: &AuthFixture,
          ) -> Result<Vec<u8>, EvalError> {
              let RelayObservedPair {
                  relay,
                  pair,
                  observed_connection,
              } = relay_then_direct_pair(fixture).await?;
              let AuthenticatedIrohParts {
                  direct,
                  client_transport,
                  server_transport,
                  mut client_session,
                  mut server_session,
              } = pair.into_parts();
              let authority =
                  prepare_stream_authority(fixture, &mut client_session, &mut server_session);
              let capacity = NonZeroUsize::new(8).expect("nonzero Task 7 stream capacity");
              let mut sender = SimStreamRuntime::new(client_session, &client_transport, capacity)
                  .map_err(|_| EvalError::Bulk)?;
              let mut receiver = SimStreamRuntime::new(server_session, &server_transport, capacity)
                  .map_err(|_| EvalError::Bulk)?;
              receiver
                  .register_operation(authority.operation().clone())
                  .map_err(|_| EvalError::Bulk)?;

              wait_for_direct_path_on(&observed_connection, RELAY_READY_TIMEOUT).await?;

              let open = authority.open(StreamId::from_bytes([0xd1; 16]));
              let mut send = sender.open_uni(&open).map_err(|_| EvalError::Bulk)?;
              let stream_id = eventually_accept(
                  &mut receiver,
                  15,
                  authority.peer_trust(),
                  authority.policy(),
              )
              .await
              .map_err(|_| EvalError::Bulk)?;
              let expected = b"path-operation".to_vec();
              send.try_send_chunk(expected.clone())
                  .map_err(|_| EvalError::Bulk)?;
              let payload = eventually_receive(&mut receiver, stream_id).await;
              send.finish();
              eventually_finished(&mut receiver, stream_id).await;

              sender.shutdown();
              receiver.shutdown();
              drop((sender, receiver));
              tokio::join!(client_transport.shutdown(), server_transport.shutdown());
              direct.shutdown().await;
              relay.shutdown().await?;

              if payload != expected {
                  return Err(EvalError::Bulk);
              }
              Ok(payload)
          }

          fn send_empty_capabilities(node: &mut SimNode<'_>) -> Result<(), EvalError> {
              let advertisement =
                  CapabilityAdvertisement::new(Vec::new()).map_err(|_| EvalError::Control)?;
              node.send_capability_advertisement(advertisement)
                  .map_err(|_| EvalError::Control)
          }

          async fn wait_for_capability_update(
              node: &mut SimNode<'_>,
              peer_trust: &TrustRecord,
          ) -> Result<(), EvalError> {
              timeout(RELAY_READY_TIMEOUT, async {
                  loop {
                      match node.receive_one(peer_trust) {
                          Ok(NodeEvent::CapabilitiesUpdated) => return Ok(()),
                          Err(NodeError::Receive(ControlReceiveError::Empty)) => {
                              tokio::task::yield_now().await;
                          }
                          Ok(_) | Err(_) => return Err(EvalError::Control),
                      }
                  }
              })
              .await
              .map_err(|_| EvalError::Timeout)?
          }

          async fn wait_for_direct_path_on(
              connection: &Connection,
              wait: Duration,
          ) -> Result<(), EvalError> {
              let mut paths = connection.paths_stream();
              timeout(wait, async {
                  while let Some(paths) = paths.next().await {
                      if paths.iter().any(|path| path.remote_addr().is_ip()) {
                          return Ok(());
                      }
                  }
                  Err(EvalError::Connect)
              })
              .await
              .map_err(|_| EvalError::Timeout)?
          }

          async fn connect_relay_pair(
          '''
          if text.count(insert_before) != 1:
              raise SystemExit('connect_relay_pair anchor mismatch')
          relay.write_text(text.replace(insert_before, helpers, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Focused semantic gate
        run: cargo test -p crosslab-m9-networking --test relay --test session --test lifecycle
      - name: Commit invariant repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/m9-networking/src/scenarios
          git diff --cached --quiet || git commit -m "test(networking): prove Iroh path authority invariants"
          git push
