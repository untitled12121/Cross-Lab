name: Task 6 Migrate Simulator Tests

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
      - name: Migrate simulator fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/sim/tests/stream_scenarios.rs')
          text = path.read_text()
          old_fields = '''    operation_name: OperationName,
              trust_revision: u64,
              policy_revision: u64,
              grant: crosslab_policy::AuthorizationGrant,'''
          new_fields = '''    operation_name: OperationName,
              policy: PolicyState,
              grant: crosslab_policy::AuthorizationGrant,'''
          if old_fields not in text:
              raise SystemExit('fixture fields shape changed')
          text = text.replace(old_fields, new_fields, 1)

          old_init = '''            operation_name,
              trust_revision,
              policy_revision: policy.revision(),
              grant,'''
          new_init = '''            operation_name,
              policy,
              grant,'''
          if old_init not in text:
              raise SystemExit('fixture initializer shape changed')
          text = text.replace(old_init, new_init, 1)

          old_accept = '.accept_one(15, fixture.trust_revision, fixture.policy_revision)'
          count = text.count(old_accept)
          if count < 1:
              raise SystemExit('no old accept_one call sites found')
          text = text.replace(old_accept, '.accept_one(15, &fixture.sender_trust, &fixture.policy)')
          text = text.replace('self.trust_revision', 'self.sender_trust.trust_revision()')
          text = text.replace('self.policy_revision', 'self.policy.revision()')
          text = text.replace('fixture.trust_revision', 'fixture.sender_trust.trust_revision()')
          text = text.replace('fixture.policy_revision', 'fixture.policy.revision()')
          path.write_text(text)
          print(f'migrated {count} accept_one call sites')
          PY
          rm .github/workflows/task6-migrate-sim-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/sim/tests/stream_scenarios.rs .github/workflows/task6-migrate-sim-tests.yml
          git diff --cached --check
          git commit -m "test(sim): derive stream currentness from local state"
          git push origin HEAD:m9-authority-replay-remediation
