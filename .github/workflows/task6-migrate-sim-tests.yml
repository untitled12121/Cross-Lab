name: Task 6 Migrate Simulator Tests

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
      - name: Migrate simulator fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/sim/tests/stream_scenarios.rs')
          text = path.read_text()

          replacements = [
              ('    trust_revision: u64,\n    policy_revision: u64,\n', '    policy: PolicyState,\n'),
              ('            trust_revision,\n            policy_revision: policy.revision(),\n', '            policy,\n'),
              ('.accept_one(15, fixture.trust_revision, fixture.policy_revision)', '.accept_one(15, &fixture.sender_trust, &fixture.policy)'),
              ('self.trust_revision', 'self.sender_trust.trust_revision()'),
              ('self.policy_revision', 'self.policy.revision()'),
              ('fixture.trust_revision', 'fixture.sender_trust.trust_revision()'),
              ('fixture.policy_revision', 'fixture.policy.revision()'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'missing expected migration token: {old!r}')
              text = text.replace(old, new)
              print(f'replaced {count}: {old!r}')

          if 'trust_revision: u64' in text or 'policy_revision: u64' in text:
              raise SystemExit('legacy fixture revision fields remain')
          path.write_text(text)
          PY
          rm .github/workflows/task6-migrate-sim-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/sim/tests/stream_scenarios.rs .github/workflows/task6-migrate-sim-tests.yml
          git diff --cached --check
          git commit -m "test(sim): derive stream currentness from local state"
          git push origin HEAD:m9-authority-replay-remediation
