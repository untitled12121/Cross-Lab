name: M9 Task 8 Reconnect RED

on:
  push:
    branches:
      - m9-task8-network-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Forced reconnect authority RED
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Reconnect contract
        run: cargo test -p crosslab-m9-networking --test netprobe_runtime forced_reconnect_refreshes_binding_session_and_control -- --nocapture
