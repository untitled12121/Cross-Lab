name: M9 Task 8 Step 5 Split Auth RED

on:
  push:
    branches:
      - m9-task8-network-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Split-side Iroh authentication RED
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Split-side auth contract
        run: cargo test -p crosslab-m9-networking --test session split_side_authentication_preserves_session_and_binding_semantics -- --nocapture
