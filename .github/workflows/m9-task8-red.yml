name: M9 Task 8 Formatter

on:
  push:
    branches:
      - m9-task8-network-evidence

permissions:
  contents: write

jobs:
  format:
    name: Apply rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Format and checkpoint
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo 'rustfmt already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/m9-networking
          git commit -m 'style(networking): format Task 8 runtime'
          git push origin HEAD:m9-task8-network-evidence
