name: M9 Task 8 RED

on:
  push:
    branches:
      - m9-task8-network-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Quinn auth timing RED
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Quinn auth timing contract
        run: cargo test -p crosslab-m9-networking --test baseline quinn_baseline_records_connect_auth_control_bulk_and_shutdown -- --nocapture
