name: M9 Task 8 Netns Marker RED

on:
  push:
    branches:
      - m9-task8-network-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Netns TSV phase marker RED
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Netns marker contract
        run: cargo test -p crosslab-m9-networking --test netns netns_script_owns_forwarding_nat_path_gate_and_cleanup -- --nocapture
