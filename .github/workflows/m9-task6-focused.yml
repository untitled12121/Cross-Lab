name: M9 Task 6 Focused

on:
  push:
    branches:
      - m9-task6-iroh-lifecycle

permissions:
  contents: read

jobs:
  lifecycle:
    name: Iroh Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Focused lifecycle test
        run: cargo test -p crosslab-m9-networking --test lifecycle
