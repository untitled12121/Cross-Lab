name: M9 Task 7 Green

on:
  push:
    branches:
      - m9-task7-owner-relay-path

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Reuse existing authentication over a connected pair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('experiments/m9-networking/src/scenarios/auth.rs')
          text = path.read_text()

          old = '''pub async fn bootstrap_direct_pair(fixture: &AuthFixture) -> Result<BootstrapIrohPair, EvalError> {
              let direct = direct_pair().await?;
              let ReservedControlStreams {
          '''
          new = '''pub async fn bootstrap_direct_pair(fixture: &AuthFixture) -> Result<BootstrapIrohPair, EvalError> {
              let direct = direct_pair().await?;
              bootstrap_connected_pair(fixture, direct).await
          }

          async fn bootstrap_connected_pair(
              fixture: &AuthFixture,
              direct: DirectPair,
          ) -> Result<BootstrapIrohPair, EvalError> {
              let ReservedControlStreams {
          '''
          if text.count(old) != 1:
              raise SystemExit('bootstrap anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''pub(crate) async fn authenticate_direct_pair_with_peer_trust(
              fixture: &AuthFixture,
              attempt: AuthAttempt,
              client_peer_trust: &TrustRecord,
              server_peer_trust: &TrustRecord,
          ) -> Result<AuthenticatedIrohPair, Box<RejectedAuthentication>> {
              let mut bootstrap = bootstrap_direct_pair(fixture)
                  .await
                  .expect("deterministic Iroh authentication bootstrap");
          '''
          new = '''pub(crate) async fn authenticate_connected_pair(
              fixture: &AuthFixture,
              direct: DirectPair,
          ) -> Result<AuthenticatedIrohPair, Box<RejectedAuthentication>> {
              authenticate_connected_pair_with_peer_trust(
                  fixture,
                  AuthAttempt::Normal,
                  direct,
                  &fixture.responder_trust,
                  &fixture.initiator_trust,
              )
              .await
          }

          pub(crate) async fn authenticate_direct_pair_with_peer_trust(
              fixture: &AuthFixture,
              attempt: AuthAttempt,
              client_peer_trust: &TrustRecord,
              server_peer_trust: &TrustRecord,
          ) -> Result<AuthenticatedIrohPair, Box<RejectedAuthentication>> {
              let direct = direct_pair()
                  .await
                  .expect("deterministic Iroh connection bootstrap");
              authenticate_connected_pair_with_peer_trust(
                  fixture,
                  attempt,
                  direct,
                  client_peer_trust,
                  server_peer_trust,
              )
              .await
          }

          async fn authenticate_connected_pair_with_peer_trust(
              fixture: &AuthFixture,
              attempt: AuthAttempt,
              direct: DirectPair,
              client_peer_trust: &TrustRecord,
              server_peer_trust: &TrustRecord,
          ) -> Result<AuthenticatedIrohPair, Box<RejectedAuthentication>> {
              let mut bootstrap = bootstrap_connected_pair(fixture, direct)
                  .await
                  .expect("deterministic Iroh authentication bootstrap");
          '''
          if text.count(old) != 1:
              raise SystemExit('authentication anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Focused relay test
        run: cargo test -p crosslab-m9-networking --test relay
      - name: Commit green implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock experiments/m9-networking
          git diff --cached --quiet || git commit -m "test(networking): validate owner relay and Iroh path changes"
          git push
