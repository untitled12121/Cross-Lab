name: M9 Maintenance

on:
  push:
    branches:
      - m9-remote-networking

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-remote-networking
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Reconcile terminal stream semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/core/tests/stream_admission.rs')
          text = path.read_text()
          text = text.replace(
              'fn valid_single_stream_is_admitted_once_and_consumed_after_finish() {',
              'fn valid_single_stream_is_admitted_once_and_retired_after_finish() {',
          )
          old = '''    admission.finish_stream(open.stream_id()).unwrap();
    assert_eq!(admission.active_stream_count(), 0);
    assert_eq!(
        fixture.admit(&mut admission, &open),
        Err(StreamAdmissionError::DuplicateStreamIndex)
    );'''
          new = '''    admission.finish_stream(open.stream_id()).unwrap();
    assert_eq!(admission.active_stream_count(), 0);
    assert_eq!(
        fixture.admit(&mut admission, &open),
        Err(StreamAdmissionError::OperationNotFound)
    );'''
          if old not in text:
              raise SystemExit('expected stream admission assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Lock fuzz workspace
        run: cargo generate-lockfile --manifest-path fuzz/Cargo.toml
      - name: Format workspace
        run: cargo fmt
      - name: Commit maintenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/tests/stream_admission.rs fuzz/Cargo.lock
          git commit -m "test(security): retire terminal stream authority and lock fuzz deps [skip ci]"
          git push origin HEAD:m9-remote-networking
