name: Task4 Final Fixture Migration V3

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Run complete Task 4 fixture migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_region(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          def replace_one(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          workflow = Path('.github/workflows/task4-final-fixture-migrate.yml').read_text().splitlines()
          start = workflow.index("          python3 - <<'PY'") + 1
          end = workflow.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])

          stale_exact = "text = one(text, stale_old, stale_new, 'm5 stale credential test')"
          stale_region = "text = region(text, '    let newer_credential = DeviceCredential::issue_for_public_key(', '\\n    let pair = transport_pair([0x81; 32]);', stale_new)"
          wrong_exact = "text = one(text, wrong_old, wrong_new, 'm5 wrong-owner test')"
          wrong_region = "text = region(text, '    let wrong_delegation = AuthorityDelegation::issue(', '\\n    let pair = transport_pair([0x92; 32]);', wrong_new)"
          if script.count(stale_exact) != 1 or script.count(wrong_exact) != 1:
              raise SystemExit('base task 4 migration script shape changed')
          script = script.replace(stale_exact, stale_region, 1)
          script = script.replace(wrong_exact, wrong_region, 1)
          exec(compile(script, '<task4-migration>', 'exec'), {})

          path = Path('crates/core/tests/pairing_initial_epoch.rs')
          text = path.read_text()
          old_import = 'use crosslab_identity::{AuthorityDelegation, AuthorityRole, DeviceId, OwnerId, OwnerRootRecord};'
          new_import = 'use crosslab_identity::{\n    AuthorityDelegation, AuthorityRole, DeviceId, OwnerAuthorityState, OwnerId, OwnerRootRecord,\n};'
          text = replace_one(text, old_import, new_import, 'pairing_initial_epoch import')
          anchor = '\n'.join([
              '    let delegation = AuthorityDelegation::issue(',
              '        owner_id,',
              '        AuthorityRole::DeviceSigning,',
              '        &issuer_key,',
              '        0,',
              '        &root_key,',
              '    );',
          ])
          replacement = anchor + '\n    let mut authority = OwnerAuthorityState::new(root);\n    authority.accept_delegation(delegation).unwrap();'
          text = replace_one(text, anchor, replacement, 'pairing_initial_epoch authority setup')
          old_call = '\n'.join([
              '        .issue_initial_joiner_credential(',
              '            &root,',
              '            &delegation,',
              '            &issuer_key,',
              '            PairingInstant::from_ticks(20),',
              '        )',
          ])
          new_call = '\n'.join([
              '        .issue_initial_joiner_credential(',
              '            &authority,',
              '            &issuer_key,',
              '            PairingInstant::from_ticks(20),',
              '        )',
          ])
          text = replace_one(text, old_call, new_call, 'pairing_initial_epoch issue call')
          path.write_text(text)

          path = Path('crates/core/tests/control_replay.rs')
          text = path.read_text()
          old_import = '    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerId, OwnerRootRecord,\n'
          new_import = '    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerAuthorityState, OwnerId,\n    OwnerRootRecord,\n'
          text = replace_one(text, old_import, new_import, 'control_replay import')
          text = replace_region(
              text,
              'struct Fixture {',
              '\n}\n\nimpl Fixture',
              '''struct Fixture {
              authority: OwnerAuthorityState,
              local_key: SigningKey,
              peer_key: SigningKey,
              local_credential: DeviceCredential,
              peer_credential: DeviceCredential,
              peer_trust: TrustRecord,
          }''',
          )
          text = replace_region(
              text,
              '    fn new() -> Self {',
              '\n\n    fn local_capabilities',
              '''    fn new() -> Self {
              let owner_id = OwnerId::from_bytes([0x10; 32]);
              let root_key = SigningKey::from_secret_bytes([0x11; 32]);
              let root = OwnerRootRecord::new(owner_id, &root_key, 0);
              let issuer_key = SigningKey::from_secret_bytes([0x12; 32]);
              let delegation = AuthorityDelegation::issue(
                  owner_id,
                  AuthorityRole::DeviceSigning,
                  &issuer_key,
                  0,
                  &root_key,
              );
              let mut authority = OwnerAuthorityState::new(root);
              authority.accept_delegation(delegation).unwrap();
              let local_key = SigningKey::from_secret_bytes([0x13; 32]);
              let peer_key = SigningKey::from_secret_bytes([0x14; 32]);
              let local_credential = DeviceCredential::issue_current(
                  owner_id,
                  DeviceId::from_bytes([0x15; 32]),
                  &local_key,
                  0,
                  &authority,
                  &issuer_key,
              )
              .unwrap();
              let peer_credential = DeviceCredential::issue_current(
                  owner_id,
                  DeviceId::from_bytes([0x16; 32]),
                  &peer_key,
                  0,
                  &authority,
                  &issuer_key,
              )
              .unwrap();
              let transition = PairingTrustTransition::issue_current(
                  &peer_credential,
                  TransitionId::from_bytes([0x17; 32]),
                  [0x18; 32],
                  &authority,
                  &issuer_key,
              )
              .unwrap();
              let peer_trust = transition
                  .establish_current(&peer_credential, &authority)
                  .unwrap();

              Self {
                  authority,
                  local_key,
                  peer_key,
                  local_credential,
                  peer_credential,
                  peer_trust,
              }
          }''',
          )
          text = replace_one(
              text,
              '            self.root.owner_id(),',
              '            self.authority.root().owner_id(),',
              'control_replay transcript owner',
          )
          text = replace_region(
              text,
              '        session\n            .authenticate(SessionActivation::new(',
              '\n        let local_capabilities',
              '''        session
              .authenticate(SessionActivation::new(
                  &self.authority,
                  SessionHandshakeSide::new(&self.local_credential, &ranges, &features),
                  SessionHandshakeSide::new(&self.peer_credential, &ranges, &features),
                  SessionAuthRole::Initiator,
                  &self.peer_trust,
                  [0x1a; 32],
                  [0x1b; 32],
                  &binding,
                  TransportSecurityClass::InProcessTest,
                  &local_proof,
                  &peer_proof,
              ))
              .unwrap();''',
          )
          for obsolete in ('self.root', 'self.delegation'):
              if obsolete in text:
                  raise SystemExit(f'control_replay obsolete authority reference remains: {obsolete}')
          path.write_text(text)

          path = Path('crates/core/tests/pairing_expiry_flow.rs')
          text = path.read_text()
          old_import = 'use crosslab_identity::{AuthorityDelegation, AuthorityRole, DeviceId, OwnerId, OwnerRootRecord};'
          new_import = 'use crosslab_identity::{\n    AuthorityDelegation, AuthorityRole, DeviceId, OwnerAuthorityState, OwnerId, OwnerRootRecord,\n};'
          text = replace_one(text, old_import, new_import, 'pairing_expiry import')
          text = replace_one(text, anchor, replacement, 'pairing_expiry authority setup')
          old_issue = '\n'.join([
              '        .issue_initial_joiner_credential(',
              '            &root,',
              '            &delegation,',
              '            &issuer_key,',
              '            PairingInstant::from_ticks(19),',
              '        )',
          ])
          new_issue = '\n'.join([
              '        .issue_initial_joiner_credential(',
              '            &authority,',
              '            &issuer_key,',
              '            PairingInstant::from_ticks(19),',
              '        )',
          ])
          text = replace_one(text, old_issue, new_issue, 'pairing_expiry issue call')
          text = replace_one(
              text,
              '        .accept_credential(&root, &delegation, &credential, &joiner_key)',
              '        .accept_credential(&authority, &credential, &joiner_key)',
              'pairing_expiry accept call',
          )
          old_commit = '\n'.join([
              '        inviter.commit_trust(',
              '            &accepted,',
              '            TransitionId::from_bytes([0x5c; 32]),',
              '            &root,',
              '            &delegation,',
              '            &issuer_key,',
              '            delegation.delegation_epoch(),',
              '            PairingInstant::from_ticks(20),',
              '        ),',
          ])
          new_commit = '\n'.join([
              '        inviter.commit_trust(',
              '            &accepted,',
              '            TransitionId::from_bytes([0x5c; 32]),',
              '            &authority,',
              '            &issuer_key,',
              '            PairingInstant::from_ticks(20),',
              '        ),',
          ])
          text = replace_one(text, old_commit, new_commit, 'pairing_expiry commit call')
          path.write_text(text)
          PY
          cargo fmt
          cargo check -p crosslab-sim --test session_scenarios --all-features
          cargo check -p crosslab-sim --test m5_scenarios --all-features
          cargo check -p crosslab-core --test pairing_initial_epoch --all-features
          cargo check -p crosslab-core --test control_replay --all-features
          cargo check -p crosslab-core --test pairing_expiry_flow --all-features
          cargo check --workspace --all-targets --all-features
          rm .github/workflows/task4-final-fixture-migrate.yml
          rm .github/workflows/task4-final-fixture-migrate-v2.yml
          rm .github/workflows/task4-final-fixture-migrate-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: migrate final task 4 authority fixtures"
          git push origin HEAD:m9-authority-replay-remediation
