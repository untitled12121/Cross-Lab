name: Task 7 Root Caller Fix

on:
  push:
    branches:
      - m9-authority-replay-remediation
    paths:
      - .github/workflows/task7-root-caller-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Migrate authority callers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          for path, issue_count, apply_revoked_count, apply_other_count in [
              ("apps/sim/tests/lifecycle.rs", 2, 1, 1),
              ("apps/sim/tests/stream_scenarios.rs", 1, 1, 0),
              ("apps/sim/tests/control_lifecycle.rs", 1, 1, 0),
              ("apps/sim/tests/security_hardening.rs", 1, 1, 0),
              ("crates/core/tests/session_lifecycle.rs", 1, 1, 0),
          ]:
              replace_count(
                  path,
                  "            self.authority.root(),\n            &self.root_key,",
                  "            &self.authority,\n            &self.root_key,",
                  issue_count,
              )
              replace_count(
                  path,
                  ".apply_root(&mut revoked, self.authority.root())",
                  ".apply_root(&mut revoked, &self.authority)",
                  apply_revoked_count,
              )
              if apply_other_count:
                  replace_count(
                      path,
                      ".apply_root(&mut other, self.authority.root())",
                      ".apply_root(&mut other, &self.authority)",
                      apply_other_count,
                  )

          for path in [
              "crates/core/tests/stream_currentness.rs",
              "crates/policy/tests/authority_currentness.rs",
          ]:
              replace_count(
                  path,
                  "        fixture.authority.root(),\n        &fixture.root_key,",
                  "        &fixture.authority,\n        &fixture.root_key,",
                  1,
              )
              replace_count(
                  path,
                  ".apply_root(&mut revoked, fixture.authority.root())" if "stream_currentness" in path else ".apply_root(&mut fixture.record, fixture.authority.root())",
                  ".apply_root(&mut revoked, &fixture.authority)" if "stream_currentness" in path else ".apply_root(&mut fixture.record, &fixture.authority)",
                  1,
              )

          replace_count(
              "transports/quic/src/session_auth_tests/lifecycle_tests.rs",
              "        fixture.authority.root(),\n        &root_key,",
              "        &fixture.authority,\n        &root_key,",
              1,
          )
          replace_count(
              "transports/quic/src/session_auth_tests/lifecycle_tests.rs",
              ".apply_root(&mut revoked, fixture.authority.root())",
              ".apply_root(&mut revoked, &fixture.authority)",
              1,
          )

          replace_count(
              "crates/policy/tests/trust_transitions.rs",
              "TrustTransition::issue_root_revocation(&record, transition_id, authority.root(), &root_key)",
              "TrustTransition::issue_root_revocation(&record, transition_id, &authority, &root_key)",
              1,
          )
          replace_count(
              "crates/policy/tests/trust_transitions.rs",
              ".apply_root(&mut record, authority.root())",
              ".apply_root(&mut record, &authority)",
              1,
          )

          for path in [
              "crates/core/tests/session_auth.rs",
              "crates/core/tests/debug_privacy.rs",
          ]:
              replace_count(
                  path,
                  "    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerId, OwnerRootRecord,\n",
                  "    AuthorityDelegation, AuthorityRole, DeviceCredential, DeviceId, OwnerAuthorityState, OwnerId,\n    OwnerRootRecord,\n",
                  1,
              )
              marker = (
                  "        );\n        let initiator_key = SigningKey::from_secret_bytes([0x13; 32]);"
                  if path.endswith("session_auth.rs")
                  else "    );\n    let initiator_key = SigningKey::from_secret_bytes([0xe4; 32]);"
              )
              replacement = (
                  "        );\n        let mut authority = OwnerAuthorityState::new(root);\n        authority.accept_delegation(delegation).unwrap();\n        let initiator_key = SigningKey::from_secret_bytes([0x13; 32]);"
                  if path.endswith("session_auth.rs")
                  else "    );\n    let mut authority = OwnerAuthorityState::new(root);\n    authority.accept_delegation(delegation).unwrap();\n    let initiator_key = SigningKey::from_secret_bytes([0xe4; 32]);"
              )
              replace_count(path, marker, replacement, 1)
              replace_count(
                  path,
                  "            &root,\n            &delegation,\n            &issuer_key," if path.endswith("session_auth.rs") else "        &root,\n        &delegation,\n        &issuer_key,",
                  "            &authority,\n            &issuer_key," if path.endswith("session_auth.rs") else "        &authority,\n        &issuer_key,",
                  2,
              )
          PY
          cargo fmt --all

          echo '=== remaining raw authority call shapes after migration ==='
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("crates"), Path("apps"), Path("transports")]
          patterns = {
              "credential raw parts": re.compile(r"DeviceCredential::issue(?:_for_public_key)?\([\s\S]{0,500}?&(?:root|delegation),[\s\S]{0,160}?&(?:delegation|issuer_key),"),
              "root revocation raw root": re.compile(r"(?:issue_root_revocation|apply_root)\([\s\S]{0,320}?\.root\(\)"),
              "current-suffixed API": re.compile(r"\b(?:issue_current|issue_for_public_key_current|verify_current|rotate_current|establish_current|accept_successor_credential_current|issue_delegated_revocation_current|apply_delegated_current)\b"),
          }
          for label, pattern in patterns.items():
              print(f"--- {label} ---")
              for base in roots:
                  for path in base.rglob("*.rs"):
                      text = path.read_text()
                      for match in pattern.finditer(text):
                          line = text.count("\n", 0, match.start()) + 1
                          snippet = " ".join(match.group(0).split())[:220]
                          print(f"{path}:{line}: {snippet}")
          PY

          cargo check --workspace --all-targets --all-features
      - name: Commit caller migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/task7-root-caller-fix.yml
          git add apps/sim/tests/lifecycle.rs apps/sim/tests/stream_scenarios.rs apps/sim/tests/control_lifecycle.rs apps/sim/tests/security_hardening.rs crates/core/tests/session_lifecycle.rs crates/core/tests/stream_currentness.rs crates/core/tests/session_auth.rs crates/core/tests/debug_privacy.rs crates/policy/tests/authority_currentness.rs crates/policy/tests/trust_transitions.rs transports/quic/src/session_auth_tests/lifecycle_tests.rs .github/workflows/task7-root-caller-fix.yml
          git commit -m "refactor(security): finish authority-state caller migration"
          git push origin HEAD:m9-authority-replay-remediation
