          grep -RInE 'issue_current|issue_for_public_key_current|verify_current|rotate_current|establish_current|accept_successor_credential_current|issue_delegated_revocation_current|apply_delegated_current' crates apps transports || true
          grep -RIn 'minimum_delegation_epoch' crates apps transports || true

          cargo check --workspace --all-targets --all-features
      - name: Commit caller migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/task7-root-caller-fix.yml
          git add crates apps transports .github/workflows/task7-root-caller-fix.yml
          git commit -m "refactor(security): finish authority-state caller migration"
          git push origin HEAD:m9-authority-replay-remediation
