name: Task 7 Authority Caller Migration

on:
  push:
    branches:
      - m9-authority-replay-remediation
    paths:
      - .github/workflows/task7-root-caller-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Migrate authority callers
        run: |
          python3 .github/scripts/task7_migrate.py
          python3 .github/scripts/task7_policy_tail.py
          python3 .github/scripts/task7_currentness_tail.py
          cargo fmt --all
          echo '=== remaining authority migration inventory ==='
          grep -RInE 'issue_current|issue_for_public_key_current|verify_current|rotate_current|establish_current|accept_successor_credential_current|issue_delegated_revocation_current|apply_delegated_current' crates apps transports || true
          grep -RIn 'minimum_delegation_epoch' crates apps transports || true
          cargo check --workspace --all-targets --all-features
      - name: Commit caller migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/task7-root-caller-fix.yml .github/scripts/task7_migrate.py .github/scripts/task7_policy_tail.py .github/scripts/task7_currentness_tail.py
          git add crates apps transports .github/workflows/task7-root-caller-fix.yml .github/scripts/task7_migrate.py .github/scripts/task7_policy_tail.py .github/scripts/task7_currentness_tail.py
          git commit -m "refactor(security): finish authority-state caller migration"
          git push origin HEAD:m9-authority-replay-remediation
