name: M9 Stale Stream Test Fix

on:
  push:
    branches:
      - m9-remote-networking

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-remote-networking
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Reconcile stale simulator expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/sim/tests/stream_scenarios.rs')
          text = path.read_text()
          old = '''        Err(SimStreamError::Admission(\n            StreamAdmissionError::DuplicateStreamIndex\n        ))'''
          new = '''        Err(SimStreamError::Admission(\n            StreamAdmissionError::OperationNotFound\n        ))'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused simulator regression
        run: cargo test -p crosslab-sim --test stream_scenarios s007_authorized_single_stream_flows_in_order_and_cannot_be_reused
      - name: Trace unmaintained paste dependency
        run: cargo tree -i paste
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/sim/tests/stream_scenarios.rs
          git commit -m "test(security): reconcile retired stream authority [skip ci]"
          git push origin HEAD:m9-remote-networking
