name: Task 4 Remediation Verify

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Verify Task 4 core
        run: cargo test -p crosslab-core --all-features
      - name: Verify Task 4 simulator
        run: cargo test -p crosslab-sim --all-features
      - name: Verify Task 4 Quinn
        run: cargo test -p crosslab-transport-quic --all-features
