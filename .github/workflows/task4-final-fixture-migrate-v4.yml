name: Task4 Final Fixture Migration V4

on:
  push:
    branches:
      - m9-authority-replay-remediation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Run final Task 4 fixture migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/task4-final-fixture-migrate-v3.yml').read_text().splitlines()
          start = workflow.index("          python3 - <<'PY'") + 1
          end = workflow.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          old = "'\\n}\\n\\nimpl Fixture'"
          new = "'\\n\\nimpl Fixture'"
          if script.count(old) != 1:
              raise SystemExit(f'expected one control_replay fixture boundary, found {script.count(old)}')
          script = script.replace(old, new, 1)
          exec(compile(script, '<task4-final-migration>', 'exec'), {})
          PY
          cargo fmt
          cargo check -p crosslab-sim --test session_scenarios --all-features
          cargo check -p crosslab-sim --test m5_scenarios --all-features
          cargo check -p crosslab-core --test pairing_initial_epoch --all-features
          cargo check -p crosslab-core --test control_replay --all-features
          cargo check -p crosslab-core --test pairing_expiry_flow --all-features
          cargo check --workspace --all-targets --all-features
          rm .github/workflows/task4-final-fixture-migrate.yml
          rm .github/workflows/task4-final-fixture-migrate-v2.yml
          rm .github/workflows/task4-final-fixture-migrate-v3.yml
          rm .github/workflows/task4-final-fixture-migrate-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: migrate final task 4 authority fixtures"
          git push origin HEAD:m9-authority-replay-remediation
