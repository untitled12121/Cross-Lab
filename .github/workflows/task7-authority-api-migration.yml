name: Task 7 Authority API Migration

on:
  push:
    branches:
      - m9-authority-replay-remediation
    paths:
      - .github/workflows/task7-authority-api-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m9-authority-replay-remediation
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Remove caller-selected authority APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern!r}")
              p.write_text(updated)

          path = "crates/identity/src/credential.rs"
          replace_once(path, "    pub fn issue(\n", "    fn issue_with_authority_parts(\n")
          replace_once(path, "        Self::issue_for_public_key(\n", "        Self::issue_for_public_key_with_authority_parts(\n")
          replace_once(path, "    pub fn issue_current(\n", "    pub fn issue(\n")
          replace_once(path, "    pub fn issue_for_public_key(\n", "    fn issue_for_public_key_with_authority_parts(\n")
          replace_once(path, "    pub fn issue_for_public_key_current(\n", "    pub fn issue_for_public_key(\n")
          replace_once(
              path,
              "        let issuer = authority.current_delegation(AuthorityRole::DeviceSigning)?;\n        Self::issue_for_public_key(\n",
              "        let issuer = authority.current_delegation(AuthorityRole::DeviceSigning)?;\n        Self::issue_for_public_key_with_authority_parts(\n",
          )
          replace_once(path, "    pub fn verify(\n", "    fn verify_with_authority_parts(\n")
          replace_once(path, "    pub fn verify_current(\n", "    pub fn verify(\n")
          replace_once(
              path,
              "        self.verify(\n            authority.root(),\n",
              "        self.verify_with_authority_parts(\n            authority.root(),\n",
          )
          regex_once(
              path,
              r"\n    pub fn rotate\(\n.*?\n    }\n\n    pub fn rotate_current\(",
              "\n    pub fn rotate(",
          )

          path = "crates/policy/src/authorization/approval.rs"
          replace_once(path, "    pub fn issue(\n", "    fn issue_with_authority_parts(\n")
          replace_once(path, "    pub fn issue_current(\n", "    pub fn issue(\n")
          replace_once(
              path,
              "        Self::issue(\n            scope,\n            issued_at,\n            expires_at,\n            authority.root(),\n",
              "        Self::issue_with_authority_parts(\n            scope,\n            issued_at,\n            expires_at,\n            authority.root(),\n",
          )
          replace_once(path, "    pub fn verify(\n", "    fn verify_with_authority_parts(\n")
          replace_once(path, "    pub fn verify_current(\n", "    pub fn verify(\n")
          replace_once(
              path,
              "        self.verify(authority.root(), delegation, delegation.delegation_epoch())\n",
              "        self.verify_with_authority_parts(\n            authority.root(),\n            delegation,\n            delegation.delegation_epoch(),\n        )\n",
          )

          path = "crates/policy/src/trust/pairing.rs"
          replace_once(path, "    pub fn issue(\n", "    fn issue_with_authority_parts(\n")
          replace_once(path, "    pub fn issue_current(\n", "    pub fn issue(\n")
          replace_once(
              path,
              "        Self::issue(\n            credential,\n            transition_id,\n            pairing_evidence_digest,\n            authority.root(),\n",
              "        Self::issue_with_authority_parts(\n            credential,\n            transition_id,\n            pairing_evidence_digest,\n            authority.root(),\n",
          )
          replace_once(path, "    pub fn establish(\n", "    fn establish_with_authority_parts(\n")
          replace_once(path, "    pub fn establish_current(\n", "    pub fn establish(\n")
          replace_once(
              path,
              "        self.establish(\n            credential,\n            authority.root(),\n",
              "        self.establish_with_authority_parts(\n            credential,\n            authority.root(),\n",
          )

          path = "crates/policy/src/trust/mod.rs"
          replace_once(
              path,
              "    pub fn accept_successor_credential(\n",
              "    fn accept_successor_credential_with_authority_parts(\n",
          )
          replace_once(
              path,
              "    pub fn accept_successor_credential_current(\n",
              "    pub fn accept_successor_credential(\n",
          )
          replace_once(
              path,
              "        self.accept_successor_credential(\n            successor,\n            authority.root(),\n",
              "        self.accept_successor_credential_with_authority_parts(\n            successor,\n            authority.root(),\n",
          )

          path = "crates/policy/src/trust/transition.rs"
          replace_once(
              path,
              "        root: &OwnerRootRecord,\n        root_key: &SigningKey,\n    ) -> Result<Self, TrustTransitionError> {\n        ensure_record_active(record)?;\n",
              "        authority: &OwnerAuthorityState,\n        root_key: &SigningKey,\n    ) -> Result<Self, TrustTransitionError> {\n        ensure_record_active(record)?;\n        let root = authority.root();\n",
          )
          replace_once(
              path,
              "    pub fn issue_delegated_revocation(\n",
              "    fn issue_delegated_revocation_with_authority_parts(\n",
          )
          replace_once(
              path,
              "    pub fn issue_delegated_revocation_current(\n",
              "    pub fn issue_delegated_revocation(\n",
          )
          replace_once(
              path,
              "        Self::issue_delegated_revocation(\n            record,\n            transition_id,\n            authority.root(),\n",
              "        Self::issue_delegated_revocation_with_authority_parts(\n            record,\n            transition_id,\n            authority.root(),\n",
          )
          replace_once(
              path,
              "        root: &OwnerRootRecord,\n    ) -> Result<(), TrustTransitionError> {\n        self.validate_common(record)?;\n        if self.issuer_role != AuthorityRole::OwnerRoot {\n",
              "        authority: &OwnerAuthorityState,\n    ) -> Result<(), TrustTransitionError> {\n        self.validate_common(record)?;\n        let root = authority.root();\n        if self.issuer_role != AuthorityRole::OwnerRoot {\n",
          )
          replace_once(
              path,
              "    pub fn apply_delegated(\n",
              "    fn apply_delegated_with_authority_parts(\n",
          )
          replace_once(
              path,
              "    pub fn apply_delegated_current(\n",
              "    pub fn apply_delegated(\n",
          )
          replace_once(
              path,
              "        self.apply_delegated(\n            record,\n            authority.root(),\n",
              "        self.apply_delegated_with_authority_parts(\n            record,\n            authority.root(),\n",
          )

          replacements = [
              ("DeviceCredential::issue_for_public_key_current(", "DeviceCredential::issue_for_public_key("),
              ("DeviceCredential::issue_current(", "DeviceCredential::issue("),
              ("OwnerApprovalEvidence::issue_current(", "OwnerApprovalEvidence::issue("),
              ("PairingTrustTransition::issue_current(", "PairingTrustTransition::issue("),
              ("TrustTransition::issue_delegated_revocation_current(", "TrustTransition::issue_delegated_revocation("),
              (".accept_successor_credential_current(", ".accept_successor_credential("),
              (".apply_delegated_current(", ".apply_delegated("),
              (".establish_current(", ".establish("),
              (".rotate_current(", ".rotate("),
              (".verify_current(", ".verify("),
          ]
          roots = [Path("crates"), Path("apps"), Path("transports")]
          for root in roots:
              for p in root.rglob("*.rs"):
                  text = p.read_text()
                  updated = text
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != text:
                      p.write_text(updated)
          PY
          rm .github/workflows/task7-authority-api-discovery.yml
          cargo fmt --all
      - name: Commit API removal RED checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates apps transports .github/workflows/task7-authority-api-discovery.yml
          git commit -m "refactor(security): remove caller-selected authority APIs"
          git push origin HEAD:m9-authority-replay-remediation
      - name: Compile migration checklist
        run: cargo check --workspace --all-targets --all-features
