name: Pairing Branch Maintenance

on:
  push:
    branches:
      - product-pairing-ui
    paths:
      - ".github/workflows/pairing-branch-maintenance.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/desktop/**"
      - "crates/core/**"
      - "crates/identity/**"
      - "crates/identity-store/**"
      - "crates/mobile-ffi/**"

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Apply generated maintenance changes
        run: |
          cargo fmt --all
          cargo metadata --format-version 1 > /dev/null
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock Cargo.toml apps/desktop crates/core crates/identity crates/identity-store crates/mobile-ffi
            git commit -m "style(pairing): apply generated formatting and lockfile"
            git push origin HEAD:product-pairing-ui
          fi
