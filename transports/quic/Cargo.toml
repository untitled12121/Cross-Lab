[package]
name = "crosslab-transport-quic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
development-provisioning = ["dep:serde", "dep:serde_json"]

[dependencies]
crosslab-core = { path = "../../crates/core" }
crosslab-crypto = { path = "../../crates/crypto" }
crosslab-identity = { path = "../../crates/identity" }
crosslab-policy = { path = "../../crates/policy" }
crosslab-protocol = { path = "../../crates/protocol" }
quinn.workspace = true
rustls.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
crosslab-mobile-ffi = { path = "../../crates/mobile-ffi" }
crosslab-runtime = { path = "../../crates/runtime" }
crosslab-sim = { path = "../../apps/sim" }
rcgen.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
